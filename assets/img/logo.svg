<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Модернизация исторической эмблемы «Дента» (1986):
       две разорванные дуги, крест из полосок, полярная звезда -->
  <!-- Внешняя дуга (ель), разрыв слева-сверху под звезду -->
  <path d="M27.14 4.43 A28 28 0 1 1 4.43 27.14" fill="none" stroke="#1f3d37" stroke-width="2.6" stroke-linecap="round"/>
  <!-- Внутренняя дуга (золото), разрыв слева-сверху у звезды -->
  <path d="M30.08 10.08 A22 22 0 1 1 10.08 30.08" fill="none" stroke="#8a6a3b" stroke-width="2" stroke-linecap="round"/>
  <!-- Полярная звезда в разрыве внешней дуги -->
  <g transform="translate(12.2 12.2)">
    <path d="M6.00,0.00 L2.31,0.96 L4.24,4.24 L0.96,2.31 L0.00,6.00 L-0.96,2.31 L-4.24,4.24 L-2.31,0.96 L-6.00,0.00 L-2.31,-0.96 L-4.24,-4.24 L-0.96,-2.31 L-0.00,-6.00 L0.96,-2.31 L4.24,-4.24 L2.31,-0.96 Z" fill="#8a6a3b"/>
    <circle r="1.5" fill="#faf7f2"/>
  </g>
  <!-- Крест из полосок (ель) -->
  <g fill="#1f3d37">
    <!-- перекладина: вертикальные полоски -->
    <rect x="17.0" y="27" width="2.8" height="10" rx="1.4"/>
    <rect x="21.4" y="27" width="2.8" height="10" rx="1.4"/>
    <rect x="25.8" y="27" width="2.8" height="10" rx="1.4"/>
    <rect x="30.2" y="27" width="2.8" height="10" rx="1.4"/>
    <rect x="34.6" y="27" width="2.8" height="10" rx="1.4"/>
    <rect x="39.0" y="27" width="2.8" height="10" rx="1.4"/>
    <rect x="43.4" y="27" width="2.8" height="10" rx="1.4"/>
    <!-- вертикаль: горизонтальные полоски -->
    <rect x="27" y="18.4" width="10" height="2.8" rx="1.4"/>
    <rect x="27" y="22.8" width="10" height="2.8" rx="1.4"/>
    <rect x="27" y="42.8" width="10" height="2.8" rx="1.4"/>
    <rect x="27" y="38.4" width="10" height="2.8" rx="1.4"/>
  </g>
</svg>
